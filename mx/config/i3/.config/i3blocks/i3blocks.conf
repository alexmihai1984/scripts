# i3blocks config file
#
# Please see man i3blocks for a complete reference!
# The man page is also hosted at http://vivien.github.io/i3blocks
#
# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
#
# The top properties below are applied to every block, but can be overridden.
# Each block command defaults to the script name to avoid boilerplate.
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=15
markup=none

# Volume indicator
#
# The first parameter sets the step (and units to display)
# The second parameter overrides the mixer selection
# See the script for details.
[volume]
# label=VOL
label= 
instance=Master
#instance=PCM
interval=1
signal=10
min_width= VOL 100%
command=/usr/share/i3blocks/volume 5 pulse
separator=false
separator_block_width=0

[memory]
# label=  
interval=10
# min_width= MEM 10.0G/15.5G (99%) 
command=sh -c 'printf "<span foreground=\"#8ec07c\" background=\"#1A2023\"></span><span foreground=\"#1A2023\" background=\"#8ec07c\">   %s  </span><span foreground=\"#1A2023\" background=\"#8ec07c\"></span>" "$(~/.config/i3blocks/scripts/memory.sh)"'
markup=pango
separator=false
separator_block_width=0

[disk]
label=   
interval=30
min_width= DISK 200G/233G (99%) 
command=~/.config/i3blocks/scripts/disk.sh
separator=false
separator_block_width=0

[cpu_usage]
# label=   
interval=1
# min_width= CPU: 100%
# command=~/.config/i3blocks/scripts/cpu.sh
command=sh -c 'printf "<span foreground=\"#d79921\" background=\"#1A2023\"></span><span foreground=\"#1A2023\" background=\"#d79921\">   %s  </span><span foreground=\"#1A2023\" background=\"#d79921\"></span>" "$(~/.config/i3blocks/scripts/cpu.sh)"'
markup=pango
separator=false
separator_block_width=0

[battery]
label=  󱊦 
interval=10
min_width= BAT 100%   02:22
command=~/.config/i3blocks/scripts/battery.sh
# command=sh -c 'printf "<span foreground=\"#458588\" background=\"#1A2023\"></span><span foreground=\"#1A2023\" background=\"#458588\">  󱊦 %s  </span><span foreground=\"#d79921\" background=\"#458588\"></span>" "$(~/.config/i3blocks/scripts/battery.sh)"'
# markup=pango
separator=false
separator_block_width=0

[wifi]
instance=wlan0
interval=10
# command=~/.config/i3blocks/scripts/wifi.sh
command=sh -c 'printf "<span foreground=\"#458588\" background=\"#1A2023\"></span><span foreground=\"#1A2023\" background=\"#458588\">   %s  </span><span foreground=\"#1A2023\" background=\"#458588\"></span>" "$(~/.config/i3blocks/scripts/wifi.sh)"'
markup=pango
separator=false
separator_block_width=0

[date]
command=date '+%a %Y-%m-%d   '
# command=sh -c 'printf "<span foreground=\"#458588\" background=\"#1A2023\"></span><span foreground=\"#1A2023\" background=\"#458588\">   %s  </span><span foreground=\"#b8bb26\" background=\"#458588\"></span>" "$(date "+%a %Y-%m-%d")"'
label=   
interval=60
markup=pango
separator=false
separator_block_width=0
# min_width= CAL  Sat  2026-10-24 

[time]
# command=date '+%H:%M'
command=sh -c 'printf "<span foreground=\"#b8bb26\" background=\"#1A2023\"></span><span foreground=\"#1A2023\" background=\"#b8bb26\">   %s  </span><span foreground=\"#1A2023\" background=\"#b8bb26\"></span>" "$(date +%H:%M)"'
# label=  
interval=5
markup=pango
separator=false
separator_block_width=0
# min_width= CLOCK 17:24

# [time_test]
# command=sh -c 'info=$(date "+%H:%M"); printf "<span foreground=\"#cc241d\" background=\"#1A2023\"></span><span foreground=\"#282828\" background=\"#cc241d\">   %s  </span><span foreground=\"#1A2023\" background=\"#cc241d\"></span>\n" "$info"'
# interval=1
# markup=pango
# separator=false
