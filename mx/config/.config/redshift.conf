[redshift]
; Set the day and night screen temperatures (e.g., 6500K day / 3700K night)
temp-day=6500
temp-night=3500

; Smooth transition between day and night
transition=1

; Set the location provider to manual
location-provider=manual
adjustment-method=randr

[manual]
; ENTER YOUR COORDINATES HERE (e.g., London)
lat=44.4396
lon=-26.0963
